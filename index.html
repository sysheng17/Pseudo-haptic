<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Pad-Contact Slime - 最終層級修復</title>
    <style>
        /* 鎖定手機視窗，禁止任何滾動與橡皮筋特效 */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; font-family: sans-serif;
            position: fixed;
        }
        
        /* 視訊視窗：置底層 (z-index: 1) */
        #webcam-container { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; z-index: 1; 
            transform: scaleX(-1); /* 鏡像畫面 */
        }
        #webcam { 
            width: 100%; height: 100%; object-fit: cover; 
        }
        
        /* 3D 畫布：【核心修正】強制釘在最上層 (z-index: 999) 且不阻擋手勢觸控 */
        #canvas-container { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: 999; 
            pointer-events: none; /* 讓點擊事件可以穿透到下層的 video */
        }
        
        /* 畫布本體強制撐開 */
        #canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        
        /* UI 面板：浮動於相機之上 (z-index: 1000) */
        #ui-panel { 
            position: absolute; bottom: 30px; left: 5%; 
            width: 90%; z-index: 1000; 
            background: rgba(15, 23, 42, 0.85); padding: 14px; 
            border-radius: 12px; color: white; box-shadow: 0 4px 16px rgba(0,0,0,0.6); 
            backdrop-filter: blur(8px); box-sizing: border-box;
        }
        h1 { margin: 0 0 4px 0; font-size: 1rem; color: #a855f7; display: inline-block; }
        #status { font-size: 0.85rem; color: #facc15; font-weight: bold; float: right; }
        .hint { font-size: 0.7rem; color: #cbd5e1; line-height: 1.3; margin-top: 4px; clear: both; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="webcam-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>
    
    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h1>AR 史萊姆指腹互動</h1>
        <div id="status">準備中...</div>
        <div class="hint">💡 鏡頭開啟後，紫色史萊姆會浮現在畫面正中央。請伸出右手，用大拇指與食指的<b>指腹肉墊</b>去捏取它。</div>
    </div>

    <script src="hand-tracker.js"></script>
    <script src="pseudo-haptics.js"></script>
</body>
</html>
