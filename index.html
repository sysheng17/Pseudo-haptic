<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Slime Sandbox - Final Fix</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; font-family: sans-serif;
            position: fixed;
        }
        #webcam-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; transform: scaleX(-1); }
        #webcam { width: 100%; height: 100%; object-fit: cover; display: block; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; pointer-events: none; }
        #ui-panel { 
            position: absolute; bottom: 30px; left: 5%; width: 90%; z-index: 1000; 
            background: rgba(15, 23, 42, 0.85); padding: 14px; border-radius: 12px; color: white; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.6); backdrop-filter: blur(8px); box-sizing: border-box;
        }
        h1 { margin: 0 0 4px 0; font-size: 1rem; color: #a855f7; display: inline-block; }
        #status { font-size: 0.85rem; color: #facc15; font-weight: bold; float: right; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="webcam-container"><video id="webcam" autoplay playsinline muted></video></div>
    <div id="canvas-container"></div>
    <div id="ui-panel">
        <h1>AR 史萊姆控制台</h1>
        <div id="status">初始化中...</div>
    </div>
    <script src="pseudo-haptics.js"></script>
</body>
</html>
